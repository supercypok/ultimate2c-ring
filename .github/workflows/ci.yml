name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Run offline safety and desktop tests
        run: python -m unittest discover -s tests -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-build.txt
      - name: Build the Windows package
        run: python scripts/build_windows.py
      - name: Verify bundled HID and Tcl/Tk without accessing a device
        run: |
          & .\dist\Ultimate2CRing\Ultimate2CRingCLI.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application check failed.' }
      - name: Upload package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultimate2c-ring-windows-x64
          path: |
            dist/ultimate2c-ring-*-windows-x64.zip
            dist/ultimate2c-ring-*-windows-x64.zip.sha256
          if-no-files-found: error
